<!DOCTYPE html>
<html>
<head>
    <title>관리자 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #9FB3DF, #BDDDE4, #FFF1D5, #9EC6F3);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        .btn-login {
            background-color: #9EC6F3;
            border: none;
            color: white;
        }

        .btn-login:hover {
            background-color: #9FB3DF;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h4 class="mb-4 text-center">🔐 관리자 로그인</h4>
        {% if error %}
            <div class="alert alert-danger">비밀번호가 틀렸습니다.</div>
        {% endif %}
        <form method="post">
            <div class="mb-3">
                <label class="form-label">비밀번호</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-login w-100">로그인</button>
        </form>
    </div>
</body>
</html>
