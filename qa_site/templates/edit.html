<!DOCTYPE html>
<html>
<head>
    <title>질문 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #F8F9FA;
            font-family: system-ui, sans-serif;
        }
        .custom-card {
            background-color: #FFF1D5;
            border: 1px solid #9FB3DF;
            border-radius: 12px;
        }
        .btn-custom {
            background-color: #9EC6F3;
            border: none;
            color: white;
        }
        .btn-custom:hover {
            background-color: #9FB3DF;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="card custom-card shadow-sm p-4">
        <h4 class="mb-4">✏️ 질문 수정</h4>
        <form method="post">
            <div class="mb-3">
                <label class="form-label">제목</label>
                <input type="text" class="form-control" name="title" value="{{ question[2] }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">내용</label>
                <textarea name="content" class="form-control" rows="6" required>{{ question[3] }}</textarea>
            </div>
            <button type="submit" class="btn btn-custom">수정 완료</button>
            <a href="{{ url_for('question', question_id=question[0]) }}" class="btn btn-secondary">← 돌아가기</a>
        </form>
    </div>
</div>

</body>
</html>
